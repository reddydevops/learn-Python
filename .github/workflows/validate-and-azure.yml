name: Validate and Azure Read-only

on:
  push: {}
  pull_request: {}
  workflow_dispatch:
    inputs:
      storage_account:
        description: 'Storage account name to query (for manual runs)'
        required: false
        default: ''
      resource_group:
        description: 'Resource group name (optional)'
        required: false
        default: ''

jobs:
  validate:
    name: Syntax & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install linting tools
        run: python -m pip install flake8

      - name: Install project requirements (optional)
        if: ${{ hashFiles('requirements.txt')!='' }}
        run: python -m pip install -r requirements.txt

      - name: Syntax check (compile all)
        run: python -m compileall -q .

      - name: Lint with flake8
        run: flake8 . --max-line-length=120

  azure-readonly:
    name: Azure - Get Storage Details (manual)
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Run get_storage_details.py
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ github.event.inputs.resource_group }}
        run: |
          if [ -z "${{ github.event.inputs.storage_account }}" ]; then
            echo "No storage_account input provided. Please pass storage_account when dispatching this workflow.";
            exit 1;
          fi
          python get_storage_details.py -n "${{ github.event.inputs.storage_account }}" -g "${{ github.event.inputs.resource_group }}"
